[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logdiff"
version = "0.1.0"
description = "Local, zero-telemetry diff for logs, stack traces and agent tool-call histories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logdiff = "logdiff.cli:main"

[tool.setuptools]
packages = ["logdiff"]
